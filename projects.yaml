# Project registry for dusktreader's toolkit
#
# This file is the single source of truth for which projects appear on the site
# and how they are categorized. The toolkit refresh command reads this file,
# fetches version/release data from PyPI and GitHub, and injects tables into
# the markdown files.
#
# Fields:
#   repo:             GitHub repo name (under dusktreader/)
#   language:         Implementation language (python, go, ...)
#   package_name:     Package name on the registry (omit if not published)
#   package_registry: Package registry hostname, e.g. pypi.org (omit if not published)
#   description:      One-line description for tables
#   docs_url:         Documentation site URL (omit if none)

libraries:
  - repo: flask-praetorian
    language: python
    package_name: flask-praetorian
    package_registry: pypi.org
